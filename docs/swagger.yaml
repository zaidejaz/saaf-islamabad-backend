basePath: /api/v1
definitions:
  handlers.AssignWorkerRequest:
    properties:
      remarks:
        type: string
      route_info:
        example: Use the back entrance off Margalla Rd
        type: string
      worker_id:
        type: string
    required:
    - worker_id
    type: object
  handlers.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/handlers.UserSummary'
    type: object
  handlers.CompleteAssignmentRequest:
    properties:
      remarks:
        example: Resolved on site
        type: string
    type: object
  handlers.CreateAssignmentRequest:
    properties:
      remarks:
        example: Please resolve within 48 hours
        type: string
      report_id:
        type: string
      route_info:
        example: Approach from Street 7, look for the blue gate
        type: string
      staff_id:
        type: string
      worker_id:
        type: string
    required:
    - report_id
    - staff_id
    type: object
  handlers.CreateCategoryRequest:
    properties:
      default_department_id:
        type: string
      description:
        example: Streetlight not working
        type: string
      name:
        example: Broken Street Light
        type: string
    required:
    - name
    type: object
  handlers.CreateConversationRequest:
    properties:
      participant_id:
        type: string
    required:
    - participant_id
    type: object
  handlers.CreateDepartmentRequest:
    properties:
      contact_email:
        example: waste@islamabad.gov
        type: string
      description:
        example: Handles all waste-related issues
        type: string
      name:
        example: Waste Management
        type: string
    required:
    - name
    type: object
  handlers.CreateNotificationRequest:
    properties:
      message:
        example: Your report is now in review
        type: string
      report_id:
        type: string
      title:
        example: Status Update
        type: string
      type:
        enum:
        - status_update
        - safety_alert
        - nearby_issue
        example: status_update
        type: string
      user_id:
        type: string
    required:
    - message
    - title
    - type
    - user_id
    type: object
  handlers.CreateReportRequest:
    properties:
      address:
        example: Street 5, G-9, Islamabad
        type: string
      category_id:
        type: string
      description:
        example: Large pile of uncollected garbage
        type: string
      image_urls:
        items:
          type: string
        type: array
      latitude:
        example: 33.6844
        type: number
      longitude:
        example: 73.0479
        type: number
      title:
        example: Garbage pile on Street 5
        type: string
    required:
    - latitude
    - longitude
    type: object
  handlers.CreateSafetyAlertRequest:
    properties:
      expires_in_hours:
        example: 24
        type: integer
      radius_km:
        example: 2.5
        type: number
      report_id:
        type: string
    required:
    - expires_in_hours
    - radius_km
    - report_id
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: admin@saafislamabad.pk
        type: string
      identifier:
        example: "+923001234567"
        type: string
      password:
        example: secret123
        type: string
      phone:
        example: "+923001234567"
        type: string
    required:
    - password
    type: object
  handlers.RegisterRequest:
    properties:
      department_id:
        type: string
      email:
        example: ali@example.com
        type: string
      full_name:
        example: Ali Khan
        type: string
      password:
        example: secret123
        minLength: 6
        type: string
      phone:
        example: "+923001234567"
        type: string
      role:
        enum:
        - citizen
        - admin
        - staff
        - worker
        example: citizen
        type: string
    required:
    - full_name
    - password
    - role
    type: object
  handlers.SendMessageRequest:
    properties:
      content:
        example: Heading to site now.
        maxLength: 5000
        minLength: 1
        type: string
    required:
    - content
    type: object
  handlers.UpdateCategoryRequest:
    properties:
      default_department_id:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  handlers.UpdateDepartmentRequest:
    properties:
      contact_email:
        type: string
      description:
        type: string
      name:
        example: Waste Management
        type: string
    type: object
  handlers.UpdateReportStatusRequest:
    properties:
      comment:
        example: Issue is being reviewed
        type: string
      status:
        enum:
        - submitted
        - in_review
        - assigned
        - in_progress
        - resolved
        - rejected
        example: in_review
        type: string
    required:
    - status
    type: object
  handlers.UpdateWorkerProfileRequest:
    properties:
      email:
        example: ahmed@saafislamabad.pk
        type: string
      full_name:
        example: Ahmed Raza
        type: string
      phone:
        example: "+923001234567"
        type: string
    type: object
  handlers.UserSummary:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  models.Assignment:
    properties:
      assigned_at:
        type: string
      assigned_by:
        type: string
      assigner:
        $ref: '#/definitions/models.User'
      completed_at:
        type: string
      dispatched_at:
        type: string
      id:
        type: string
      remarks:
        type: string
      report:
        $ref: '#/definitions/models.Report'
      report_id:
        type: string
      resolution_image_url:
        description: |-
          URL of the resolution image uploaded by the worker once the issue
          is fixed on-site. Mirrored onto the report's image set as well.
        type: string
      route_info:
        description: |-
          Route / location info delivered to the worker. Free-form so staff can
          drop a Google Maps link, written directions, or a meeting point.
        type: string
      route_latitude:
        description: |-
          Latitude/Longitude duplicated from Report at dispatch time so the
          worker has an authoritative pin even if the report is later edited.
        type: number
      route_longitude:
        type: number
      staff:
        $ref: '#/definitions/models.User'
      staff_id:
        type: string
      worker:
        $ref: '#/definitions/models.User'
      worker_id:
        type: string
    type: object
  models.Conversation:
    properties:
      channel:
        $ref: '#/definitions/models.MessageChannel'
      created_at:
        type: string
      id:
        type: string
      last_message_at:
        type: string
      messages:
        items:
          $ref: '#/definitions/models.Message'
        type: array
      participants:
        items:
          $ref: '#/definitions/models.ConversationParticipant'
        type: array
    type: object
  models.ConversationParticipant:
    properties:
      conversation_id:
        type: string
      id:
        type: string
      joined_at:
        type: string
      last_read_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
    type: object
  models.Department:
    properties:
      contact_email:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.IssueCategory:
    properties:
      created_at:
        type: string
      default_department:
        $ref: '#/definitions/models.Department'
      default_department_id:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.Message:
    properties:
      content:
        type: string
      conversation_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      read_at:
        type: string
      receiver_id:
        type: string
      sender:
        $ref: '#/definitions/models.User'
      sender_id:
        type: string
    type: object
  models.MessageChannel:
    enum:
    - admin_staff
    - staff_worker
    type: string
    x-enum-varnames:
    - ChannelAdminStaff
    - ChannelStaffWorker
  models.Notification:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      message:
        type: string
      report_id:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/models.NotificationType'
      user_id:
        type: string
    type: object
  models.NotificationType:
    enum:
    - status_update
    - safety_alert
    - nearby_issue
    type: string
    x-enum-varnames:
    - NotifStatusUpdate
    - NotifSafetyAlert
    - NotifNearbyIssue
  models.Priority:
    enum:
    - low
    - medium
    - high
    type: string
    x-enum-varnames:
    - PriorityLow
    - PriorityMedium
    - PriorityHigh
  models.Report:
    properties:
      address:
        type: string
      ai_confidence_score:
        type: number
      category:
        $ref: '#/definitions/models.IssueCategory'
      category_id:
        type: string
      created_at:
        type: string
      department:
        $ref: '#/definitions/models.Department'
      department_id:
        type: string
      description:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/models.ReportImage'
        type: array
      is_duplicate:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      priority_level:
        $ref: '#/definitions/models.Priority'
      resolved_at:
        type: string
      severity_level:
        $ref: '#/definitions/models.Severity'
      status:
        $ref: '#/definitions/models.ReportStatus'
      status_history:
        items:
          $ref: '#/definitions/models.ReportStatusHistory'
        type: array
      title:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
    type: object
  models.ReportImage:
    properties:
      created_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_primary:
        type: boolean
      is_resolution:
        type: boolean
      report_id:
        type: string
      uploaded_by:
        type: string
    type: object
  models.ReportStatus:
    enum:
    - submitted
    - in_review
    - assigned
    - in_progress
    - resolved
    - rejected
    type: string
    x-enum-varnames:
    - StatusSubmitted
    - StatusInReview
    - StatusAssigned
    - StatusInProgress
    - StatusResolved
    - StatusRejected
  models.ReportStatusHistory:
    properties:
      changed_at:
        type: string
      changed_by:
        type: string
      changer:
        $ref: '#/definitions/models.User'
      comment:
        type: string
      id:
        type: string
      new_status:
        type: string
      old_status:
        type: string
      report_id:
        type: string
    type: object
  models.Role:
    enum:
    - citizen
    - admin
    - staff
    - worker
    type: string
    x-enum-varnames:
    - RoleCitizen
    - RoleAdmin
    - RoleStaff
    - RoleWorker
  models.SafetyAlert:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      radius_km:
        type: number
      report:
        $ref: '#/definitions/models.Report'
      report_id:
        type: string
    type: object
  models.Severity:
    enum:
    - low
    - moderate
    - critical
    type: string
    x-enum-varnames:
    - SeverityLow
    - SeverityModerate
    - SeverityCritical
  models.User:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      department:
        $ref: '#/definitions/models.Department'
      department_id:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_verified:
        type: boolean
      phone:
        type: string
      role:
        $ref: '#/definitions/models.Role'
      updated_at:
        type: string
    type: object
  utils.APIResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  utils.PaginatedResponse:
    properties:
      data: {}
      page:
        type: integer
      page_size:
        type: integer
      success:
        type: boolean
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: zaid@example.com
    name: Zaid Ejaz
  description: Backend API for the Saaf Islamabad civic issue reporting platform.
    Citizens can report issues like garbage, broken streetlights, and road damage.
    Admins assign issues to department staff who resolve them.
  title: Saaf Islamabad API
  version: "1.0"
paths:
  /assignments:
    get:
      description: Get paginated assignments. Staff sees own, worker sees own dispatched,
        admin sees all.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: List assignments
      tags:
      - Assignments
    post:
      consumes:
      - application/json
      description: Creates the staff-level ownership of a report. Optionally a worker
        can be dispatched immediately by including `worker_id`.
      parameters:
      - description: Assignment data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAssignmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Assignment'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Assign report to staff (admin)
      tags:
      - Assignments
  /assignments/{id}/assign-worker:
    patch:
      consumes:
      - application/json
      description: The staff owner of an assignment dispatches a worker to physically
        resolve the report on site. Sets the worker, route info and a location pin.
      parameters:
      - description: Assignment UUID
        in: path
        name: id
        required: true
        type: string
      - description: Worker dispatch payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AssignWorkerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Assignment'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Dispatch worker for an assignment (staff)
      tags:
      - Assignments
  /assignments/{id}/complete:
    patch:
      consumes:
      - application/json
      description: Mark an assignment as completed without going through the worker
        upload flow (e.g. desk-resolved).
      parameters:
      - description: Assignment UUID
        in: path
        name: id
        required: true
        type: string
      - description: Completion details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CompleteAssignmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Assignment'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Complete assignment (staff)
      tags:
      - Assignments
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with phone + password (citizens) or email + password
        (admin/staff/worker). Provide either `phone`, `email`, or a generic `identifier`
        along with `password`.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Login
      tags:
      - Auth
  /auth/me:
    get:
      description: Return the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Citizens register with phone + password (Pakistani format). Admin
        / staff / worker accounts use email + password.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Register a new user
      tags:
      - Auth
  /categories:
    get:
      description: Get all issue categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.IssueCategory'
                  type: array
              type: object
      summary: List categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Add a new issue category (admin only)
      parameters:
      - description: Category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.IssueCategory'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Create issue category
      tags:
      - Categories
  /categories/{id}:
    delete:
      description: Remove an issue category (admin only)
      parameters:
      - description: Category UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete category
      tags:
      - Categories
    get:
      description: Get issue category by ID
      parameters:
      - description: Category UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.IssueCategory'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Get category
      tags:
      - Categories
    put:
      consumes:
      - application/json
      description: Update issue category (admin only)
      parameters:
      - description: Category UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.IssueCategory'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Update category
      tags:
      - Categories
  /conversations:
    get:
      description: All chats the authenticated non-citizen user is part of, most recently
        active first.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: List my conversations
      tags:
      - Messaging
    post:
      consumes:
      - application/json
      description: 'Returns the existing chat with the participant if one exists,
        otherwise creates a new conversation. Allowed pairs: admin↔staff and staff↔worker.
        Citizens are not permitted.'
      parameters:
      - description: Participant
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateConversationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Conversation'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Open or fetch a 1:1 conversation
      tags:
      - Messaging
  /conversations/{id}/messages:
    get:
      description: Returns messages newest-first. Use as the polling fallback when
        websockets are unavailable.
      parameters:
      - description: Conversation UUID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.PaginatedResponse'
        "403":
          description: Forbidden
          schema:
